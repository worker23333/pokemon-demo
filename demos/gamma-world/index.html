<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#142a23"/>
  <title>Pokemon demo</title>
  <style>
    #launch-status { position:fixed; inset:0; z-index:100000; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:#142a23; color:#f0efda; font:16px/1.7 system-ui,sans-serif; }
    #launch-status[hidden] { display:none !important; }
    #launch-status article { width:min(100%,580px); }
    #launch-status h1 { font-size:clamp(24px,5vw,36px); line-height:1.3; }
    #launch-status p { color:#c6d8ca; }
    #launch-status a, #launch-status button { display:inline-block; padding:12px 18px; margin:8px 10px 8px 0; background:#d4e8a5; color:#142a23; border:0; border-radius:8px; text-decoration:none; font:600 16px/1.4 system-ui,sans-serif; cursor:pointer; }
    #launch-status a[hidden], #launch-status button[hidden] { display:none; }
    #launch-status code, #launch-status pre { white-space:pre-wrap; overflow-wrap:anywhere; }
    #launch-status details { margin-top:20px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <section id="launch-status" data-phase="waiting" role="status" aria-live="polite">
    <article>
      <small>Pokemon demo</small>
      <h1 id="launch-title">请通过本地服务打开 Pokemon demo。</h1>
      <p id="launch-message">直接打开 HTML 文件无法运行游戏模块。启动本地服务后，点击下方按钮进入。</p>
      <p id="launch-command">在项目目录运行：<code>node demos/gamma-battle/run.mjs</code></p>
      <a id="launch-open" href="http://127.0.0.1:5175/demos/gamma-world/">打开 Pokemon demo →</a>
      <button id="launch-retry" type="button" hidden>重新加载</button>
      <details id="launch-details" hidden><summary>错误详情</summary><pre id="launch-error"></pre></details>
      <noscript><p>请启用浏览器 JavaScript 后重新加载。</p></noscript>
    </article>
  </section>
  <script>
    // This fallback runs before TypeScript, WebGL or any saved game is read.
    (() => {
      const panel = document.getElementById('launch-status');
      const title = document.getElementById('launch-title');
      const message = document.getElementById('launch-message');
      document.getElementById('launch-retry').onclick = () => location.reload();
      if (location.protocol === 'file:') {
        panel.dataset.phase = 'file';
        title.textContent = '请通过本地服务打开 Pokemon demo。';
        return;
      }
      title.textContent = '正在启动 Pokemon demo…';
      message.textContent = '正在加载游戏模块。';
      document.getElementById('launch-command').hidden = true;
      document.getElementById('launch-open').hidden = true;
      window.addEventListener('error', event => {
        if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
        panel.hidden = false;
        panel.dataset.phase = 'error';
        title.textContent = '游戏模块加载失败。';
        message.textContent = '请确认本地服务仍在运行，然后重新加载。';
        document.getElementById('launch-retry').hidden = false;
      }, true);
    })();
  </script>
  <script type="module" src="./bootstrap.ts"></script>
</body>
</html>
